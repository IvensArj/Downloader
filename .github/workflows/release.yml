name: Release (Windows)

# Gera o executável para Windows e o publica em Releases.
#  - Ao enviar uma tag (ex.: v4.0): compila e cria a Release com o .zip anexado.
#  - Em "Run workflow" (manual): só compila e guarda o .zip como artefato, para testar.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Baixar FFmpeg (build LGPL)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip -MaximumRetryCount 3 -RetryIntervalSec 5
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item "ffmpeg_tmp\*\bin\ffmpeg.exe" .
          Copy-Item "ffmpeg_tmp\*\bin\ffprobe.exe" .

      - name: Gerar o executável
        shell: cmd
        run: call build_exe.bat

      - name: Conferir o resultado e calcular o SHA256
        shell: pwsh
        run: |
          $zip = "dist\BaixadorMidia-windows.zip"
          if (-not (Test-Path $zip)) { throw "O arquivo $zip não foi gerado." }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $notas = @"
          ## Como usar

          1. Baixe **BaixadorMidia-windows.zip** abaixo e extraia a pasta.
          2. Abra **BaixadorMidia.exe**.
          3. Para baixar do YouTube é preciso ter o [Deno](https://deno.com) ou o Node.js 22+ instalado
             (ou colocar o ``deno.exe`` ao lado do ``BaixadorMidia.exe``).

          O Windows pode mostrar o aviso "O Windows protegeu o computador" (SmartScreen), porque o
          programa não é assinado digitalmente. Clique em **Mais informações → Executar assim mesmo**.

          Componentes de terceiros e licenças: ``THIRD_PARTY_NOTICES.md``.

          **SHA256 do zip:** ``$hash``
          "@
          Set-Content -Path release_notes.md -Value $notas -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v4
        with:
          name: BaixadorMidia-windows
          path: dist/BaixadorMidia-windows.zip

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BaixadorMidia-windows.zip
          body_path: release_notes.md
          generate_release_notes: true
