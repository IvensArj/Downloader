[package]
name = "studio-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
